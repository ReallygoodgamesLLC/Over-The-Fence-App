workflows:
  ios-testflight:
    name: Over the Fence → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Use the SAME App Store Connect API key integration name you set up for Witch's Greenhouse
      # (Codemagic → Team settings → Integrations → Developer Portal). Change this line to match it.
      app_store_connect: "Witch Greenhouse API key"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.reallygoodgame.overthefence
      vars:
        # The app's Apple ID: App Store Connect → Over the Fence → App Information → "Apple ID" (a number)
        APP_STORE_APPLE_ID: 6829940555
      xcode: latest
    scripts:
      - name: Build the offline game page
        script: python3 build_web.py
      - name: Generate the Xcode project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Bump the build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --project "OverTheFence.xcodeproj" \
            --scheme "OverTheFence"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
